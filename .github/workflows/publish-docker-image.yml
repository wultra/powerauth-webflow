---
name: Build and Publish docker image

on:
  workflow_dispatch:
    inputs:
      push_to_registry:
        type: boolean
        default: false
        description: Publish to registry?
      environment:
        type: environment
        default: docker-internal
        description: Select the environment
      products_to_push:
        description: Array of product names for which build will be done.
        type: string
        default: '["nextstep"]'
        required: true

  pull_request:
    branches:
      - 'develop'
      - 'main'
      - 'releases/*'
    paths:
      - powerauth-nextstep/**
      - docs/db/**
  push:
    branches:
      - 'develop'
    paths:
      - powerauth-nextstep/**
      - docs/db/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set environment output
        id: set-env
        run: |
          if [ -z "${{ inputs.environment }}" ]; then
            echo "environment=docker-internal" >> $GITHUB_OUTPUT
          else
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: 'ubuntu-latest'
    needs: set-environment
    environment: ${{ needs.set-environment.outputs.environment }}
    env:
      # these are global secrets - for readonly access to artifactory
      INTERNAL_USERNAME: ${{ secrets.JFROG_USERNAME }}
      INTERNAL_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
    strategy:
      matrix:
        app: ${{ fromJSON(github.event.inputs.products_to_push)}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: jfrog-central
          server-username: INTERNAL_USERNAME
          server-password: INTERNAL_PASSWORD
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0
        with:
          cosign-release: 'v2.6.1'
        if: ${{ inputs.push_to_registry == true || (github.ref == 'refs/heads/develop' && github.actor != 'dependabot[bot]' && github.event_name == 'push')}}
      - name: Set Timestamp for docker image for development branch
        if: "!(startsWith(github.ref, 'refs/heads/releases/') || startsWith(github.ref, 'refs/tags/'))"
        run: echo "TIMESTAMP=-$(date +%Y.%m.%d)" >> $GITHUB_ENV
      - name: Get PowerAuth Webflow version
        run: |
          REVISION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "REVISION=$REVISION" >> $GITHUB_ENV
          IMAGE_VERSION=$REVISION${{ env.TIMESTAMP }}-${{ github.sha }}
          IMAGE_NAME=${{ matrix.app }}:${IMAGE_VERSION}
          INIT_IMAGE_NAME=${{ matrix.app }}-init:${IMAGE_VERSION}
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> $GITHUB_ENV
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "INIT_IMAGE_NAME=$INIT_IMAGE_NAME" >> $GITHUB_ENV
      - name: Prepare package
        run: |
          mvn -U -DuseInternalRepo=true --no-transfer-progress clean package -pl powerauth-${{ matrix.app }} -am
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ACR
        if: vars.ACR_REGISTRY_URL != '' && github.actor != 'dependabot[bot]'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY_URL }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Log in to Distribution registry
        if: vars.DISTRIBUTION_REGISTRY_URL != '' && github.actor != 'dependabot[bot]'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DISTRIBUTION_REGISTRY_URL }}
          username: ${{ vars.DISTRIBUTION_USERNAME }}
          password: ${{ secrets.DISTRIBUTION_PASSWORD }}
      - name: Set dynamic tags for image
        run: |
          echo "TAGS=${{ vars.ACR_REGISTRY_URL != ''  && format('{0}/{1}', vars.ACR_REGISTRY_URL, env.IMAGE_NAME) || '' }} \
                     ${{ vars.DISTRIBUTION_REGISTRY_URL != '' && format('{0}/{1}', vars.DISTRIBUTION_REGISTRY_URL, env.IMAGE_NAME) || '' }}" >> $GITHUB_ENV
          echo "INIT_TAGS=${{ vars.ACR_REGISTRY_URL != ''  && format('{0}/{1}', vars.ACR_REGISTRY_URL, env.INIT_IMAGE_NAME) || '' }} \
                          ${{ vars.DISTRIBUTION_REGISTRY_URL != '' && format('{0}/{1}', vars.DISTRIBUTION_REGISTRY_URL, env.INIT_IMAGE_NAME) || '' }}" >> $GITHUB_ENV
      - name: Build and push container image to registry
        uses: docker/build-push-action@v6
        with:
          push: ${{ inputs.push_to_registry == true || (github.ref == 'refs/heads/develop' && github.actor != 'dependabot[bot]' && github.event_name == 'push')}}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.TAGS }}
          file: ./powerauth-${{ matrix.app }}/docker/Dockerfile
          context: .
      - name: Build and push init container image to registry
        uses: docker/build-push-action@v6
        with:
          push: ${{ inputs.push_to_registry == true || (github.ref == 'refs/heads/develop' && github.actor != 'dependabot[bot]' && github.event_name == 'push')}}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.INIT_TAGS }}
          file: ./powerauth-${{ matrix.app }}/docker-init/Dockerfile
          context: .
      - name: Sign images with a key
        if: ${{ inputs.push_to_registry == true || (github.ref == 'refs/heads/develop' && github.actor != 'dependabot[bot]' && github.event_name == 'push')}}
        env:
          TAGS: ${{ env.TAGS }}
          INIT_TAGS: ${{ env.INIT_TAGS }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          while IFS= read -r tag; do
            tag=$(echo "$tag" | tr -d '\n' | xargs)
            digest=$(docker buildx imagetools inspect "$tag" --format "{{json .Manifest}}" | jq -r .digest | tr -d '\n')
            images+="${tag}@${digest} "
          done <<< "$(printf '%s\n%s\n' "$TAGS" "$INIT_TAGS")"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY ${images}
      - name: Verify images with a key
        if: ${{ inputs.push_to_registry == true || (github.ref == 'refs/heads/develop' && github.actor != 'dependabot[bot]' && github.event_name == 'push')}}
        env:
          TAGS: ${{ env.TAGS }}
          INIT_TAGS: ${{ env.INIT_TAGS }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
          while IFS= read -r tag; do
            tag=$(echo "$tag" | tr -d '\n' | xargs)
            digest=$(docker buildx imagetools inspect "$tag" --format "{{json .Manifest}}" | jq -r .digest | tr -d '\n')
            images+="${tag}@${digest} "
          done <<< "$(printf '%s\n%s\n' "$TAGS" "$INIT_TAGS")"
          cosign verify --key env://COSIGN_PUBLIC_KEY ${images}
